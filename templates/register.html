{% extends 'base.html' %}
{% block title %}Register — TruthScan{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo-icon">⬡</span>
      <h1>Create Account</h1>
      <p>Join TruthScan and start detecting fake news today.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-field">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="yourname" required minlength="3">
      </div>
      <div class="form-field">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-field">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn-primary btn-full">Create Account →</button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="{{ url_for('login') }}" class="gold-link">Sign in here</a>
    </p>
  </div>
</section>
{% endblock %}
